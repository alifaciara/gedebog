<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Video Player</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0f0f0f;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      overflow: hidden;
      height: 100vh;
    }

    /* Loading Screen */
    #loadingScreen {
      position: fixed;
      inset: 0;
      background: #0f0f0f;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      flex-direction: column;
      gap: 16px;
    }

    .spinner {
      width: 42px;
      height: 42px;
      border: 4px solid rgba(255,255,255,0.15);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Video Mode (fullscreen player) */
    #videoMode {
      display: none;
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 100;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      max-width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    #blogVideo {
      width: 100%;
      height: 100%;
      max-height: 100vh;
      object-fit: contain;
      background: #000;
    }

    .video-click {
      position: absolute;
      inset: 0;
      z-index: 5;
      cursor: pointer;
    }

    /* Play Button */
    #playButton {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 72px;
      height: 72px;
      background: rgba(0,0,0,0.55);
      border: 3px solid #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      cursor: pointer;
      transition: all 0.2s;
    }

    #playButton:hover {
      background: rgba(255,255,255,0.15);
      transform: translate(-50%, -50%) scale(1.08);
    }

    #playButton::after {
      content: "";
      width: 0;
      height: 0;
      border-left: 22px solid #fff;
      border-top: 14px solid transparent;
      border-bottom: 14px solid transparent;
      margin-left: 6px;
    }

    /* Progress Bar */
    .progress-area {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: rgba(255,255,255,0.2);
      cursor: pointer;
      z-index: 30;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: #ff2d55;
      transition: width 0.1s linear;
    }

    /* Close Button */
    #closeButton {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 42px;
      height: 42px;
      background: rgba(0,0,0,0.6);
      border: none;
      border-radius: 50%;
      color: #fff;
      font-size: 22px;
      cursor: pointer;
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    #closeButton:hover {
      background: rgba(255,255,255,0.2);
    }

    /* Noscript warning */
    #noscriptWarning {
      display: none;
      padding: 40px;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Loading -->
  <div id="loadingScreen">
    <div class="spinner"></div>
    <div style="opacity:0.7;font-size:14px;">Memuat...</div>
  </div>

  <!-- Video Player -->
  <div id="videoMode">
    <div class="video-wrapper">
      <video id="blogVideo" playsinline webkit-playsinline></video>
      <div class="video-click"></div>
      <div id="playButton"></div>
      <div class="progress-area">
        <div class="progress-fill"></div>
      </div>
      <button id="closeButton" title="Tutup">×</button>
    </div>
  </div>

  <noscript>
    <div id="noscriptWarning">
      <h2>JavaScript diperlukan</h2>
      <p>Aktifkan JavaScript untuk menonton video.</p>
    </div>
  </noscript>

  <script>
  //<![CDATA[
  (function(){
    var params = new URLSearchParams(window.location.search);
    var videoID = params.get("id");
    var server = params.get("ser") || "1";

    if(!videoID){
      const lastID = localStorage.getItem("lastVideoID");
      const lastSer = localStorage.getItem("lastServer") || "1";
      if(lastID){
        const newURL = `${window.location.origin}${window.location.pathname}?id=${lastID}&ser=${lastSer}`;
        window.location.href = newURL;
        return;
      } else {
        showNoVideoInfo();
        return;
      }
    } else {
      localStorage.setItem("lastVideoID", videoID);
      localStorage.setItem("lastServer", server);
    }

    var loadingScreen = document.getElementById("loadingScreen");
    if(loadingScreen) loadingScreen.style.display = "none";

    let videoSrc = "";
    function decodeBase64(str){
      try { return atob(str); }
      catch(e){ return "https://cdn2.videy.co/"; }
    }

    const serverList = {
      "1": "aHR0cHM6Ly9jZG4yLnZpZGV5LmNvLw==",
      "2": "aHR0cHM6Ly9jZG4uYWNlaW1nLmNvbS8=",
      "3": "aHR0cHM6Ly9maWxlcy5jYXRib3gubW9lLw==",
      "4": "aHR0cHM6Ly9maWxlLmdhcmRlbi8="
    };

    const baseDomain = decodeBase64(serverList[server] || serverList["1"]);
    videoSrc = `${baseDomain}${videoID}.mp4`;

    var videoMode = document.getElementById("videoMode");
    var video = document.getElementById("blogVideo");
    var play = document.getElementById("playButton");
    var clickArea = document.querySelector(".video-click");
    var progressArea = document.querySelector(".progress-area");
    var progressFill = document.querySelector(".progress-fill");
    var closeButton = document.getElementById("closeButton");

    document.body.style.overflow = "hidden";
    document.querySelectorAll("body > *:not(#videoMode)").forEach(function(el){
      if(el.id !== "loadingScreen" && el.id !== "noscriptWarning"){
        el.style.display = "none";
      }
    });

    videoMode.style.display = "flex";
    video.src = videoSrc;

    // ========== Proteksi ==========
    function enableVideoProtection(){
      document.addEventListener('contextmenu', e => {
        e.preventDefault();
        return false;
      });

      document.addEventListener('keydown', function(e){
        if(e.ctrlKey && (e.key === 'c' || e.key === 'u' || e.key === 's' || e.key === 'i' || e.key === 'a')){
          e.preventDefault();
          return false;
        }
        if(e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'C' || e.key === 'J'))){
          e.preventDefault();
          return false;
        }
      });

      document.addEventListener('copy', e => e.preventDefault());
      document.addEventListener('cut', e => e.preventDefault());
      document.addEventListener('paste', e => e.preventDefault());

      let devtoolsOpen = false;
      const threshold = 160;
      setInterval(() => {
        if(window.outerWidth - window.innerWidth > threshold || window.outerHeight - window.innerHeight > threshold){
          if(!devtoolsOpen){
            devtoolsOpen = true;
            if(video) video.pause();
            showAntiInspectWarning();
          }
        } else {
          devtoolsOpen = false;
        }
      }, 600);

      function showAntiInspectWarning(){
        const warn = document.createElement('div');
        warn.style.cssText = `
          position:fixed;top:0;left:0;width:100%;height:100vh;
          background:rgba(0,0,0,0.97);color:#ff4444;z-index:9999999;
          display:flex;align-items:center;justify-content:center;
          flex-direction:column;font-family:Arial,sans-serif;text-align:center;
        `;
        warn.innerHTML = `
          <h2>🚫 Akses Terlarang</h2>
          <p>Developer Tools terdeteksi.<br>Video di-pause untuk keamanan.</p>
          <button onclick="this.parentElement.remove()" 
            style="margin-top:20px;padding:12px 25px;font-size:16px;
                   background:#fff;color:#000;border:none;border-radius:6px;cursor:pointer;">
            Tutup & Lanjutkan
          </button>
        `;
        document.body.appendChild(warn);
      }
    }
    enableVideoProtection();

    // ========== Kontrol Video ==========
    play.onclick = function(){ video.play(); };

    clickArea.onclick = function(){
      if(video.paused) video.play();
      else video.pause();
    };

    video.onplay = function(){ play.style.display = "none"; };
    video.onpause = function(){ play.style.display = "flex"; };

    video.ontimeupdate = function(){
      if(video.duration){
        progressFill.style.width = (video.currentTime / video.duration * 100) + "%";
      }
    };

    progressArea.onclick = function(e){
      var rect = progressArea.getBoundingClientRect();
      var pos = (e.clientX - rect.left) / rect.width;
      video.currentTime = pos * video.duration;
    };

    closeButton.onclick = function(){
      history.back();
    };

    function showNoVideoInfo(){
      const infoDiv = document.createElement("div");
      infoDiv.style.cssText = `
        position:fixed;top:0;left:0;width:100%;height:100vh;
        background:#0f0f0f;color:#ffffff;z-index:9999999;
        display:flex;align-items:center;justify-content:center;
        flex-direction:column;font-family:Arial,sans-serif;
        text-align:center;padding:20px;
      `;
      infoDiv.innerHTML = `
        <h2>Video Player</h2>
        <p style="font-size:18px;margin:20px 0;">Belum ada video yang dipilih.</p>
        <p>Cari di Pencarian Faceb00k => <strong>Gobrots Jimbits Stream</strong></p>
      `;
      document.body.appendChild(infoDiv);
    }
  })();
  //]]>
  </script>
</body>
</html>
